<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRouter 免费模型看板</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --paper: #ffffff;
      --paper-2: #f9fafb;
      --ink: #101418;
      --muted: #667085;
      --line: #d8dee6;
      --line-strong: #b8c2cc;
      --teal: #007f79;
      --teal-dark: #005f5b;
      --teal-soft: #e3f5f3;
      --blue: #155eef;
      --blue-soft: #e9f0ff;
      --red: #b42318;
      --red-soft: #fff0ee;
      --gold: #8a5a00;
      --gold-soft: #fff4cf;
      --green: #067647;
      --green-soft: #e7f8ef;
      --shadow: 0 12px 30px rgba(16, 24, 40, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(244,246,248,.98) 42%, #eef2f6),
        repeating-linear-gradient(90deg, rgba(16,24,40,.045) 0 1px, transparent 1px 84px);
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
    }

    button {
      user-select: none;
    }

    .shell {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 44px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 20px;
      align-items: stretch;
      padding: 24px 0 18px;
    }

    .hero-main {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(0,127,121,.12), rgba(21,94,239,.08) 42%, rgba(255,255,255,.88)),
        var(--paper);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border: 1px solid rgba(0,127,121,.28);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      color: var(--teal-dark);
      font-size: 13px;
      font-weight: 650;
      padding: 5px 10px;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1;
      font-weight: 780;
    }

    .subtitle {
      max-width: 760px;
      margin: 0;
      color: #475467;
      font-size: 16px;
      line-height: 1.65;
    }

    .hero-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      color: #344054;
      padding: 7px 10px;
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.live { background: var(--green); }
    .dot.loading { background: var(--gold); }
    .dot.offline { background: var(--red); }

    .quick-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 16px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .quick-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .quick-title h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
    }

    .commands {
      display: grid;
      gap: 8px;
    }

    .command {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper-2);
      padding: 10px;
      min-width: 0;
    }

    code {
      font-family: Consolas, "Cascadia Mono", monospace;
      color: #24292f;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .btn {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(16,24,40,.04);
    }

    .btn:hover {
      border-color: var(--line-strong);
      background: #fbfcfd;
    }

    .btn.primary {
      border-color: var(--teal-dark);
      background: var(--teal);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--teal-dark);
    }

    .btn.compact {
      min-height: 32px;
      padding: 5px 9px;
      font-size: 13px;
    }

    .btn:disabled {
      cursor: wait;
      opacity: .68;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin: 6px 0 16px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 14px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .stat .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat .value {
      font-size: 29px;
      line-height: 1;
      font-weight: 780;
      overflow-wrap: anywhere;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(12px);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 180px 160px;
      gap: 10px;
      min-width: 0;
    }

    .search,
    .select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 11px;
      outline: none;
    }

    .search:focus,
    .select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,127,121,.13);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }

    .tab {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: #344054;
      padding: 8px 13px;
      cursor: pointer;
    }

    .tab.active {
      border-color: rgba(0,127,121,.38);
      background: var(--teal-soft);
      color: var(--teal-dark);
      font-weight: 700;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin: 22px 0 12px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
    }

    .section-note {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .model {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 14px;
      box-shadow: var(--shadow);
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .model.stealth {
      border-color: #efb3a8;
      background: linear-gradient(180deg, #fff, var(--red-soft));
    }

    .model.router {
      border-color: #e7c66a;
      background: linear-gradient(180deg, #fff, var(--gold-soft));
    }

    .model-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .name {
      font-weight: 760;
      font-size: 16px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .id {
      margin-top: 5px;
      color: var(--muted);
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .copy {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #344054;
      min-width: 38px;
      min-height: 32px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 13px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      line-height: 1.2;
      background: #eef2f6;
      color: #344054;
      white-space: nowrap;
    }

    .chip.free { background: var(--green-soft); color: var(--green); }
    .chip.stealth { background: var(--red-soft); color: var(--red); }
    .chip.router { background: var(--gold-soft); color: var(--gold); }
    .chip.vision { background: var(--blue-soft); color: var(--blue); }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: auto;
    }

    .meta-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.68);
      padding: 8px;
      min-width: 0;
    }

    .meta-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .meta-value {
      font-weight: 700;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      display: none;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 11px 12px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--paper-2);
      color: #344054;
      font-weight: 750;
      z-index: 1;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: rgba(255,255,255,.76);
      color: var(--muted);
      padding: 30px;
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      border: 1px solid rgba(0,127,121,.22);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      color: var(--teal-dark);
      padding: 10px 12px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1040px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 20px, 1240px);
        padding-top: 14px;
      }

      .hero-main {
        min-height: 0;
        padding: 18px;
      }

      .toolbar,
      .search-row {
        grid-template-columns: 1fr;
      }

      .toolbar-actions {
        justify-content: flex-start;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .section-note {
        text-align: left;
      }
    }

    @media (max-width: 430px) {
      .stats,
      .meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-main">
        <div>
          <span class="eyebrow">OpenRouter 实时免费模型监控</span>
          <h1>免费模型看板</h1>
          <p class="subtitle">自动抓取 OpenRouter 模型列表，按真实价格字段筛出零成本模型，并把匿名、预览、路由、多模态模型整理出来。</p>
        </div>
        <div class="hero-foot">
          <span class="status-pill"><span class="dot loading" id="statusDot"></span><span id="statusText">准备加载</span></span>
          <span class="status-pill" id="fetchedAt">等待刷新</span>
        </div>
      </div>

      <aside class="quick-panel">
        <div class="quick-title">
          <h2>常用模型 ID</h2>
          <button class="btn compact" id="copyTopBtn" type="button">复制推荐</button>
        </div>
        <div class="commands">
          <div class="command">
            <code id="bestAnon">stealth/ox-alpha</code>
            <button class="btn compact" data-copy="stealth/ox-alpha" type="button">复制</button>
          </div>
          <div class="command">
            <code>openrouter/free</code>
            <button class="btn compact" data-copy="openrouter/free" type="button">复制</button>
          </div>
          <div class="command">
            <code id="bestVision">nvidia/nemotron-nano-12b-v2-vl:free</code>
            <button class="btn compact" data-copy="nvidia/nemotron-nano-12b-v2-vl:free" type="button">复制</button>
          </div>
        </div>
      </aside>
    </section>

    <section class="stats" aria-label="统计">
      <div class="stat">
        <div class="label">免费模型</div>
        <div class="value" id="freeCount">0</div>
      </div>
      <div class="stat">
        <div class="label">匿名/Stealth</div>
        <div class="value" id="anonCount">0</div>
      </div>
      <div class="stat">
        <div class="label">预览模型</div>
        <div class="value" id="previewCount">0</div>
      </div>
      <div class="stat">
        <div class="label">视觉/视频输入</div>
        <div class="value" id="visionCount">0</div>
      </div>
      <div class="stat">
        <div class="label">最大上下文</div>
        <div class="value" id="maxContext">0</div>
      </div>
    </section>

    <section class="toolbar" aria-label="筛选和操作">
      <div class="search-row">
        <input class="search" id="searchBox" type="search" placeholder="搜索模型名、作者或 ID">
        <select class="select" id="sortSelect" aria-label="排序">
          <option value="recommended">推荐排序</option>
          <option value="context">上下文最大优先</option>
          <option value="name">名称 A-Z</option>
          <option value="id">ID A-Z</option>
        </select>
        <select class="select" id="viewSelect" aria-label="视图">
          <option value="cards">卡片视图</option>
          <option value="table">表格视图</option>
        </select>
      </div>
      <div class="toolbar-actions">
        <button class="btn primary" id="refreshBtn" type="button">刷新</button>
        <button class="btn" id="exportBtn" type="button">导出 JSON</button>
        <button class="btn" id="copyAnonBtn" type="button">复制匿名 ID</button>
      </div>
    </section>

    <nav class="tabs" aria-label="分类">
      <button class="tab active" data-filter="all" type="button">全部免费</button>
      <button class="tab" data-filter="anonymous" type="button">匿名</button>
      <button class="tab" data-filter="router" type="button">免费路由</button>
      <button class="tab" data-filter="preview" type="button">预览</button>
      <button class="tab" data-filter="vision" type="button">视觉</button>
      <button class="tab" data-filter="audio" type="button">音频</button>
      <button class="tab" data-filter="largeContext" type="button">长上下文</button>
    </nav>

    <section>
      <div class="section-head">
        <div>
          <h2 id="listTitle">全部免费模型</h2>
        </div>
        <div class="section-note" id="visibleCount">0 个可见</div>
      </div>
      <div class="grid" id="modelGrid"></div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>模型</th>
              <th>ID</th>
              <th>类型</th>
              <th>上下文</th>
              <th>输入</th>
              <th>输出</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">已复制</div>

  <script>
    const API_URL = "https://openrouter.ai/api/v1/models";
    const SNAPSHOT = {
      fetchedAt: "2026-08-24T18:21:25",
      source: API_URL,
      freeModels: [
        { id: "cohere/north-mini-code:free", name: "Cohere: North Mini Code (free)", context_length: 256000, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "dots-studio/dots-3-note-preview:free", name: "Dots Studio: Dots3-Note Preview (free)", context_length: 512000, input_modalities: ["text", "image"], output_modalities: ["text"] },
        { id: "google/gemma-4-26b-a4b-it:free", name: "Google: Gemma 4 26B A4B  (free)", context_length: 262144, input_modalities: ["image", "text", "video"], output_modalities: ["text"] },
        { id: "google/gemma-4-31b-it:free", name: "Google: Gemma 4 31B (free)", context_length: 262144, input_modalities: ["image", "text", "video"], output_modalities: ["text"] },
        { id: "google/lyria-3-clip-preview", name: "Google: Lyria 3 Clip Preview", context_length: 1048576, input_modalities: ["text", "image"], output_modalities: ["text", "audio"] },
        { id: "google/lyria-3-pro-preview", name: "Google: Lyria 3 Pro Preview", context_length: 1048576, input_modalities: ["text", "image"], output_modalities: ["text", "audio"] },
        { id: "liquid/lfm-2.5-2.6b:free", name: "LiquidAI: LFM2.5-2.6B (free)", context_length: 65536, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "nvidia/nemotron-3.5-content-safety:free", name: "NVIDIA: Nemotron 3.5 Content Safety (free)", context_length: 128000, input_modalities: ["text", "image"], output_modalities: ["text"] },
        { id: "nvidia/nemotron-3.5-lightning:free", name: "NVIDIA: Nemotron 3.5 Lightning (free)", context_length: 1000000, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "nvidia/nemotron-3-nano-30b-a3b:free", name: "NVIDIA: Nemotron 3 Nano 30B A3B (free)", context_length: 256000, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", name: "NVIDIA: Nemotron 3 Nano Omni (free)", context_length: 256000, input_modalities: ["text", "audio", "image", "video"], output_modalities: ["text"] },
        { id: "nvidia/nemotron-3-super-120b-a12b:free", name: "NVIDIA: Nemotron 3 Super (free)", context_length: 262144, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "nvidia/nemotron-3-ultra-550b-a55b:free", name: "NVIDIA: Nemotron 3 Ultra (free)", context_length: 1000000, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "nvidia/nemotron-nano-12b-v2-vl:free", name: "NVIDIA: Nemotron Nano 12B 2 VL (free)", context_length: 128000, input_modalities: ["image", "text", "video"], output_modalities: ["text"] },
        { id: "nvidia/nemotron-nano-9b-v2:free", name: "NVIDIA: Nemotron Nano 9B V2 (free)", context_length: 128000, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "openrouter/free", name: "Free Models Router", context_length: 200000, input_modalities: ["text", "image"], output_modalities: ["text"] },
        { id: "poolside/laguna-s-2.1:free", name: "Poolside: Laguna S 2.1 (free)", context_length: 262144, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "poolside/laguna-xs-2.1:free", name: "Poolside: Laguna XS 2.1 (free)", context_length: 262144, input_modalities: ["text"], output_modalities: ["text"] },
        { id: "stealth/ox-alpha", name: "Ox Alpha", context_length: 1048576, input_modalities: ["text", "image", "video"], output_modalities: ["text"] },
        { id: "thinkingmachines/inkling:free", name: "Thinking Machines: Inkling (free)", context_length: 262144, input_modalities: ["text", "image", "audio"], output_modalities: ["text"] },
        { id: "thinkingmachines/inkling-small:free", name: "Thinking Machines: Inkling Small (free)", context_length: 262144, input_modalities: ["text", "image", "audio"], output_modalities: ["text"] },
        { id: "z-ai/glm-5.2:free", name: "Z.ai: GLM 5.2 (free)", context_length: 256000, input_modalities: ["text"], output_modalities: ["text"] }
      ]
    };

    const state = {
      models: SNAPSHOT.freeModels,
      fetchedAt: SNAPSHOT.fetchedAt,
      source: "snapshot",
      filter: "all"
    };

    const $ = (id) => document.getElementById(id);
    const fmt = new Intl.NumberFormat("zh-CN");

    function isFree(model) {
      const prompt = Number(model?.pricing?.prompt ?? 0);
      const completion = Number(model?.pricing?.completion ?? 0);
      return prompt === 0 && completion === 0;
    }

    function isAnonymous(model) {
      const id = String(model.id || "");
      const text = [model.id, model.name, model.description].join(" ").toLowerCase();
      return /(^|\/)stealth\//i.test(id) ||
        text.includes("anonymous") ||
        text.includes("anon") ||
        text.includes("stealth") ||
        text.includes("remain anonymous");
    }

    function isRouter(model) {
      return model.id === "openrouter/free";
    }

    function isPreview(model) {
      const text = `${model.id} ${model.name}`.toLowerCase();
      return text.includes("preview") || text.includes("exp");
    }

    function hasVision(model) {
      return (model.input_modalities || []).some((x) => ["image", "video"].includes(x));
    }

    function hasAudio(model) {
      return (model.input_modalities || []).includes("audio") || (model.output_modalities || []).includes("audio");
    }

    function isLargeContext(model) {
      return (model.context_length || 0) >= 500000;
    }

    function normalize(model) {
      const arch = model.architecture || {};
      return {
        id: model.id,
        name: model.name,
        context_length: model.context_length || model.top_provider?.context_length || 0,
        input_modalities: arch.input_modalities || model.input_modalities || [],
        output_modalities: arch.output_modalities || model.output_modalities || [],
        description: model.description || ""
      };
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    function modelTypes(model) {
      return [
        isAnonymous(model) ? "匿名" : "",
        isRouter(model) ? "路由" : "",
        isPreview(model) ? "预览" : "",
        hasVision(model) ? "视觉" : "",
        hasAudio(model) ? "音频" : "",
        isLargeContext(model) ? "长上下文" : ""
      ].filter(Boolean);
    }

    function modelScore(model) {
      let score = 0;
      if (isAnonymous(model)) score += 1000;
      if (isRouter(model)) score += 850;
      if (isLargeContext(model)) score += 160;
      if (hasVision(model)) score += 70;
      if (hasAudio(model)) score += 35;
      score += Math.min((model.context_length || 0) / 10000, 100);
      return score;
    }

    function currentFiltered() {
      const q = $("searchBox").value.trim().toLowerCase();
      const sort = $("sortSelect").value;
      const filtered = state.models.filter((model) => {
        const haystack = `${model.id} ${model.name}`.toLowerCase();
        const matchesText = !q || haystack.includes(q);
        const matchesFilter =
          state.filter === "all" ||
          (state.filter === "anonymous" && isAnonymous(model)) ||
          (state.filter === "router" && isRouter(model)) ||
          (state.filter === "preview" && isPreview(model)) ||
          (state.filter === "vision" && hasVision(model)) ||
          (state.filter === "audio" && hasAudio(model)) ||
          (state.filter === "largeContext" && isLargeContext(model));
        return matchesText && matchesFilter;
      });

      return filtered.sort((a, b) => {
        if (sort === "context") return (b.context_length || 0) - (a.context_length || 0);
        if (sort === "name") return a.name.localeCompare(b.name);
        if (sort === "id") return a.id.localeCompare(b.id);
        return modelScore(b) - modelScore(a) || a.id.localeCompare(b.id);
      });
    }

    function chip(label, className = "") {
      return `<span class="chip ${className}">${escapeHtml(label)}</span>`;
    }

    function card(model) {
      const classes = [
        "model",
        isAnonymous(model) ? "stealth" : "",
        isRouter(model) ? "router" : ""
      ].filter(Boolean).join(" ");
      const typeChips = [
        chip("$0", "free"),
        isAnonymous(model) ? chip("匿名", "stealth") : "",
        isRouter(model) ? chip("路由", "router") : "",
        isPreview(model) ? chip("预览") : "",
        hasVision(model) ? chip("视觉", "vision") : "",
        hasAudio(model) ? chip("音频") : "",
        isLargeContext(model) ? chip("长上下文") : ""
      ].filter(Boolean).join("");
      return `
        <article class="${classes}">
          <div class="model-head">
            <div>
              <div class="name">${escapeHtml(model.name || model.id)}</div>
              <div class="id">${escapeHtml(model.id)}</div>
            </div>
            <button class="copy" type="button" data-copy="${escapeAttr(model.id)}" title="复制模型 ID">复制</button>
          </div>
          <div class="chips">${typeChips}</div>
          <div class="meta">
            <div class="meta-item">
              <div class="meta-label">上下文</div>
              <div class="meta-value">${fmt.format(model.context_length || 0)} tokens</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">输入/输出</div>
              <div class="meta-value">${escapeHtml((model.input_modalities || []).join(", ") || "-")} -> ${escapeHtml((model.output_modalities || []).join(", ") || "-")}</div>
            </div>
          </div>
        </article>`;
    }

    function tableRow(model) {
      const types = modelTypes(model);
      return `
        <tr>
          <td>${escapeHtml(model.name || model.id)}</td>
          <td><code>${escapeHtml(model.id)}</code></td>
          <td>${types.length ? types.map((x) => chip(x, x === "匿名" ? "stealth" : x === "路由" ? "router" : x === "视觉" ? "vision" : "")).join(" ") : chip("$0", "free")}</td>
          <td>${fmt.format(model.context_length || 0)}</td>
          <td>${escapeHtml((model.input_modalities || []).join(", ") || "-")}</td>
          <td>${escapeHtml((model.output_modalities || []).join(", ") || "-")}</td>
          <td><button class="copy" type="button" data-copy="${escapeAttr(model.id)}">复制</button></td>
        </tr>`;
    }

    function setStatus(kind, text) {
      const dot = $("statusDot");
      dot.className = `dot ${kind}`;
      $("statusText").textContent = text;
    }

    function updateQuickModels() {
      const anonymous = state.models.filter(isAnonymous).sort((a, b) => modelScore(b) - modelScore(a));
      const vision = state.models.filter(hasVision).sort((a, b) => modelScore(b) - modelScore(a));
      const bestAnon = anonymous[0]?.id || "没有匿名免费模型";
      const bestVision = vision[0]?.id || "没有视觉免费模型";
      $("bestAnon").textContent = bestAnon;
      $("bestVision").textContent = bestVision;
      document.querySelector("#bestAnon + button")?.setAttribute("data-copy", bestAnon);
      document.querySelector("#bestVision + button")?.setAttribute("data-copy", bestVision);
    }

    function render() {
      const visible = currentFiltered();
      const anonymous = state.models.filter(isAnonymous);
      const preview = state.models.filter(isPreview);
      const vision = state.models.filter(hasVision);
      const maxContext = state.models.reduce((max, m) => Math.max(max, m.context_length || 0), 0);
      const titleMap = {
        all: "全部免费模型",
        anonymous: "匿名/Stealth 免费模型",
        router: "免费路由模型",
        preview: "预览免费模型",
        vision: "视觉/视频免费模型",
        audio: "音频免费模型",
        largeContext: "长上下文免费模型"
      };

      $("freeCount").textContent = fmt.format(state.models.length);
      $("anonCount").textContent = fmt.format(anonymous.length);
      $("previewCount").textContent = fmt.format(preview.length);
      $("visionCount").textContent = fmt.format(vision.length);
      $("maxContext").textContent = maxContext >= 1000000 ? `${(maxContext / 1000000).toFixed(1)}M` : fmt.format(maxContext);
      $("visibleCount").textContent = `${fmt.format(visible.length)} 个可见`;
      $("listTitle").textContent = titleMap[state.filter];
      $("fetchedAt").textContent = state.source === "live"
        ? `实时数据 ${new Date(state.fetchedAt).toLocaleString("zh-CN")}`
        : `本地快照 ${SNAPSHOT.fetchedAt}`;

      const cardsMode = $("viewSelect").value === "cards";
      $("modelGrid").style.display = cardsMode ? "grid" : "none";
      $("tableWrap").style.display = cardsMode ? "none" : "block";
      $("modelGrid").innerHTML = visible.length ? visible.map(card).join("") : `<div class="empty">没有匹配的免费模型</div>`;
      $("tableBody").innerHTML = visible.map(tableRow).join("");
      if (!visible.length) {
        $("tableBody").innerHTML = `<tr><td colspan="7">没有匹配的免费模型</td></tr>`;
      }

      updateQuickModels();
      bindCopyButtons();
    }

    function bindCopyButtons() {
      document.querySelectorAll("[data-copy]").forEach((button) => {
        if (button.dataset.bound === "true") return;
        button.dataset.bound = "true";
        button.addEventListener("click", async () => {
          await copyText(button.dataset.copy || "");
          showToast("已复制模型 ID");
        });
      });
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    function showToast(text) {
      const toast = $("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1100);
    }

    async function refreshModels() {
      $("refreshBtn").disabled = true;
      setStatus("loading", "正在拉取 OpenRouter");
      try {
        const response = await fetch(API_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        state.models = payload.data.filter(isFree).map(normalize);
        state.fetchedAt = new Date().toISOString();
        state.source = "live";
        setStatus("live", "已连接实时数据");
      } catch (error) {
        state.models = SNAPSHOT.freeModels;
        state.fetchedAt = SNAPSHOT.fetchedAt;
        state.source = "snapshot";
        setStatus("offline", "实时拉取失败，显示快照");
      } finally {
        $("refreshBtn").disabled = false;
        render();
      }
    }

    function exportJson() {
      const payload = {
        fetchedAt: state.fetchedAt,
        source: state.source === "live" ? API_URL : "embedded snapshot",
        freeCount: state.models.length,
        anonymousFreeCount: state.models.filter(isAnonymous).length,
        anonymousFreeModels: state.models.filter(isAnonymous),
        freeModels: state.models
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "openrouter-free-models.json";
      link.click();
      URL.revokeObjectURL(url);
      showToast("JSON 已导出");
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        state.filter = button.dataset.filter;
        render();
      });
    });

    $("refreshBtn").addEventListener("click", refreshModels);
    $("exportBtn").addEventListener("click", exportJson);
    $("copyAnonBtn").addEventListener("click", async () => {
      const ids = state.models.filter(isAnonymous).map((model) => model.id).join("\n");
      await copyText(ids || "没有匿名免费模型");
      showToast("匿名模型 ID 已复制");
    });
    $("copyTopBtn").addEventListener("click", async () => {
      const ids = [
        $("bestAnon").textContent,
        "openrouter/free",
        $("bestVision").textContent
      ].filter(Boolean).join("\n");
      await copyText(ids);
      showToast("推荐模型 ID 已复制");
    });
    $("searchBox").addEventListener("input", render);
    $("sortSelect").addEventListener("change", render);
    $("viewSelect").addEventListener("change", render);

    render();
    refreshModels();
  </script>
</body>
</html>
